# Builds the Hugo site in docs/gift.dev and publishes it to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hugo modules (the hextra theme) are fetched with Go
      - uses: actions/setup-go@v7
        with:
          go-version-file: docs/gift.dev/go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - id: pages
        uses: actions/configure-pages@v6
      # the site lives below a path like /gift/, so the base URL comes from Pages and not from hugo.toml
      - name: Build
        working-directory: docs/gift.dev
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/gift.dev/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
